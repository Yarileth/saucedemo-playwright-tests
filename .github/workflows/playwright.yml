name: Playwright E2E - SauceDemo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Regresión diaria a las 10:00 ART (13:00 UTC).
    - cron: '0 13 * * 1-5'

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Verificar tipos
        run: npm run typecheck

      - name: Ejecutar suite E2E
        run: npx playwright test

      - name: Generar dashboard de resultados
        if: always()
        run: npm run dashboard

      - name: Publicar reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Publicar dashboard de resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: test-results/dashboard.html
          retention-days: 14
